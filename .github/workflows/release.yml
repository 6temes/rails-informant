name: Release

# Publishes through RubyGems trusted publishing, which matches on this file's
# name and the `release` environment: renaming either stops publishing until
# the trusted publisher on rubygems.org is changed to match.
#
# No concurrency group: a publish must never be cancelled mid-flight, and a
# group here would collide with the one ci.yml declares.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # CI skips tag pushes, so this is the only run of the gem's CI on the tagged
  # commit. A called workflow cannot hold more permission than this caller, so
  # none of its jobs can mint a publishing token.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write

    # No bundle is installed, so no development gem runs in the job that can
    # publish. rubygems/release-gem is unusable here: it runs `rake release`,
    # which refuses the tree the stamp leaves dirty.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version

      - name: Stamp the tag version into version.rb
        run: bin/stamp-version "${GITHUB_REF_NAME#v}" lib/rails_informant/version.rb

      - name: Build gem
        run: gem build rails-informant.gemspec

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # Naming the file after the tag means a build of any other version has
      # nothing to push.
      - name: Push gem
        run: gem push "rails-informant-${GITHUB_REF_NAME#v}.gem"
